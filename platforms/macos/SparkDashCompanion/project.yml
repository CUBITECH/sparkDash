name: SparkDashCompanion
options:
  bundleIdPrefix: com.sparkdash
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  SparkDashCompanion:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: sparkDash Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: sparkDash connects to the dashboard server you configure.
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkdash.companion
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: SparkDashWidgetExtension
    scheme:
      testTargets:
        - SparkDashCompanionTests
      gatherCoverageData: true

  SparkDashWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: sparkDash Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: sparkDash connects to the dashboard server you configure.
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkdash.companion.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  SparkDashCompanionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: SparkDashCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparkdash.companion.tests
        GENERATE_INFOPLIST_FILE: YES
